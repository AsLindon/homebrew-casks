name: Update X Minecraft Launcher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Update cask
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CASK="Casks/x-minecraft-launcher.rb"
          REPO="Voxelum/x-minecraft-launcher"

          tag="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
          version="${tag#v}"

          if [[ -z "$tag" || -z "$version" ]]; then
            echo "Unable to determine latest version."
            exit 1
          fi

          arm_asset="xmcl-${version}-arm64.dmg"
          intel_asset="xmcl-${version}-x64.dmg"

          rm -rf /tmp/xmcl-release
          mkdir -p /tmp/xmcl-release

          gh release download "$tag" \
            --repo "$REPO" \
            --pattern "$arm_asset" \
            --dir /tmp/xmcl-release

          gh release download "$tag" \
            --repo "$REPO" \
            --pattern "$intel_asset" \
            --dir /tmp/xmcl-release

          arm_path="/tmp/xmcl-release/${arm_asset}"
          intel_path="/tmp/xmcl-release/${intel_asset}"

          [[ -f "$arm_path" ]] || { echo "Missing asset: $arm_asset"; exit 1; }
          [[ -f "$intel_path" ]] || { echo "Missing asset: $intel_asset"; exit 1; }

          arm_sha="$(shasum -a 256 "$arm_path" | awk '{print $1}')"
          intel_sha="$(shasum -a 256 "$intel_path" | awk '{print $1}')"

          ruby <<RUBY
          path = "$CASK"
          version = "$version"
          arm = "$arm_sha"
          intel = "$intel_sha"

          text = File.read(path)

          unless text.sub!(/version\s+"[^"]+"/, %(version "#{version}"))
            abort "Unable to update version."
          end

          replacement = %(sha256 arm:   "#{arm}",\n         intel: "#{intel}")

          unless text.sub!(
            /sha256\s+:no_check|sha256\s+arm:\s*(?:"[^"]+"|:no_check),\s*\n\s*intel:\s*(?:"[^"]+"|:no_check)/,
            replacement
          )
            abort "Unable to update sha256 block."
          end

          File.write(path, text)
          RUBY

      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Casks/x-minecraft-launcher.rb

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          version="$(ruby -ne 'puts $1 if /version "([^"]+)"/' Casks/x-minecraft-launcher.rb)"
          git commit -m "Update x-minecraft-launcher to ${version}"
          git push origin main
